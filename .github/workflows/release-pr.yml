name: Release Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      router: ${{ steps.changes.outputs.router }}
      home: ${{ steps.changes.outputs.home }}
      styles: ${{ steps.changes.outputs.styles }}
      any-changes: ${{ steps.changes.outputs.router == 'true' || steps.changes.outputs.home == 'true' || steps.changes.outputs.styles == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            router:
              - 'apps/router/**'
            home:
              - 'apps/home/**'
            styles:
              - 'libs/styles/**'

  preview-releases:
    needs: detect-changes
    if: needs.detect-changes.outputs.any-changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Preview Router Release
        if: needs.detect-changes.outputs.router == 'true'
        working-directory: apps/router
        run: |
          echo "## 🚀 Router App Release Preview" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          bun x release-it --dry-run --no-git.requireCleanWorkingDir 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Preview Home Release
        if: needs.detect-changes.outputs.home == 'true'
        working-directory: apps/home
        run: |
          echo "## 🏠 Home App Release Preview" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          bun x release-it --dry-run --no-git.requireCleanWorkingDir 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Preview Styles Release
        if: needs.detect-changes.outputs.styles == 'true'
        working-directory: libs/styles
        run: |
          echo "## 🎨 Styles Library Release Preview" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          bun x release-it --dry-run --no-git.requireCleanWorkingDir 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let comment = '## 🔍 Release Preview\n\n';
            comment += 'This PR will trigger the following releases when merged:\n\n';

            if ('${{ needs.detect-changes.outputs.router }}' === 'true') {
              comment += '- 🚀 **Router App** - Changes detected in `apps/router/`\n';
            }
            if ('${{ needs.detect-changes.outputs.home }}' === 'true') {
              comment += '- 🏠 **Home App** - Changes detected in `apps/home/`\n';
            }
            if ('${{ needs.detect-changes.outputs.styles }}' === 'true') {
              comment += '- 🎨 **Styles Library** - Changes detected in `libs/styles/`\n';
            }

            comment += '\n> **Note**: Releases will be automatically created when this PR is merged to main.\n';
            comment += '> Check the job summary for detailed version preview information.';

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(comment => 
              comment.user.login === 'github-actions[bot]' && 
              comment.body.includes('🔍 Release Preview')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
