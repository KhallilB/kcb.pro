name: CI - Build, Lint, and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Detect changes to determine which apps need to be checked
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      home-changed: ${{ steps.changes.outputs.home }}
      router-changed: ${{ steps.changes.outputs.router }}
      libs-changed: ${{ steps.changes.outputs.libs }}
      root-changed: ${{ steps.changes.outputs.root }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          # If BASE_SHA is empty or null, compare with HEAD~1
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="HEAD~1"
          fi

          echo "Comparing against: $BASE_SHA"

          # Check for changes in each area
          if git diff --name-only $BASE_SHA HEAD | grep -q '^apps/home/'; then
            echo "home=true" >> $GITHUB_OUTPUT
          else
            echo "home=false" >> $GITHUB_OUTPUT
          fi

          if git diff --name-only $BASE_SHA HEAD | grep -q '^apps/router/'; then
            echo "router=true" >> $GITHUB_OUTPUT
          else
            echo "router=false" >> $GITHUB_OUTPUT
          fi

          if git diff --name-only $BASE_SHA HEAD | grep -q '^libs/'; then
            echo "libs=true" >> $GITHUB_OUTPUT
          else
            echo "libs=false" >> $GITHUB_OUTPUT
          fi

          if git diff --name-only $BASE_SHA HEAD | grep -qE '\.(json|ts|js)$|^\.github/|^eslint\.config\.|^vitest\.config\.'; then
            echo "root=true" >> $GITHUB_OUTPUT
          else
            echo "root=false" >> $GITHUB_OUTPUT
          fi

  # Lint check
  lint:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: always() && (needs.detect-changes.outputs.home-changed == 'true' || needs.detect-changes.outputs.router-changed == 'true' || needs.detect-changes.outputs.libs-changed == 'true' || needs.detect-changes.outputs.root-changed == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run ESLint
        run: bun run lint

  # TypeScript type checking
  typecheck:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: always() && (needs.detect-changes.outputs.home-changed == 'true' || needs.detect-changes.outputs.router-changed == 'true' || needs.detect-changes.outputs.root-changed == 'true')

    strategy:
      matrix:
        app: [home, router]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: TypeCheck ${{ matrix.app }}
        run: bun run typecheck:${{ matrix.app }}
        if: (matrix.app == 'home' && needs.detect-changes.outputs.home-changed == 'true') || (matrix.app == 'router' && needs.detect-changes.outputs.router-changed == 'true') || needs.detect-changes.outputs.root-changed == 'true'

  # Build check
  build:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: always() && (needs.detect-changes.outputs.home-changed == 'true' || needs.detect-changes.outputs.router-changed == 'true' || needs.detect-changes.outputs.root-changed == 'true')

    strategy:
      matrix:
        app: [home, router]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build ${{ matrix.app }} app
        run: bun run build:${{ matrix.app }}
        if: (matrix.app == 'home' && needs.detect-changes.outputs.home-changed == 'true') || (matrix.app == 'router' && needs.detect-changes.outputs.router-changed == 'true') || needs.detect-changes.outputs.root-changed == 'true'

  # Test execution
  test:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: always() && (needs.detect-changes.outputs.home-changed == 'true' || needs.detect-changes.outputs.router-changed == 'true' || needs.detect-changes.outputs.root-changed == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test
