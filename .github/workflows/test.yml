name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build home app
        run: bun run build:home

      - name: Build router app
        run: bun run build:router

      - name: Run tests
        run: bun run test

      - name: Run home app tests
        run: bun run test:home

      - name: Run router app tests
        run: bun run test:router
