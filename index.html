<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Khallil Bailey</title>
    <meta
      name="description"
      content="Frontend engineer in Los Angeles with more than five years of building product interfaces. What I’m building now, with a date on everything."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Home hides the list until the tome mounts; it never stays hidden past 6 s.
      try {
        if (location.pathname === '/' && sessionStorage.getItem('kcb:home-view') !== 'list') {
          var root = document.documentElement
          root.dataset.tome = 'pending'
          setTimeout(function () { if (root.dataset.tome === 'pending') delete root.dataset.tome }, 6000)
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
